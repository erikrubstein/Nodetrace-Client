name: Release Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      is_release: ${{ steps.meta.outputs.is_release }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      server_ref: ${{ steps.meta.outputs.server_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          is_release="false"
          is_prerelease="false"
          server_ref="main"
          if [[ "$version" == *-* ]]; then
            is_prerelease="true"
          fi
          if [[ "$version" == *-plan-preview.* ]]; then
            server_ref="feature/plan-view-preview"
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "${tag}" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match package version ${tag}" >&2
              exit 1
            fi
            is_release="true"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "is_release=${is_release}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${is_prerelease}" >> "$GITHUB_OUTPUT"
          echo "server_ref=${server_ref}" >> "$GITHUB_OUTPUT"

  build-web:
    name: Build web bundle
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run bundle:web

      - name: Upload web bundle artifact
        uses: actions/upload-artifact@v6
        with:
          name: nodetrace-web-bundle
          path: release/web/Nodetrace-Web-v${{ needs.validate.outputs.version }}.zip
          if-no-files-found: error

  build-installers:
    name: Build ${{ matrix.label }} installer
    runs-on: ${{ matrix.os }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            build_command: npx electron-builder --win nsis --publish never
            final_name: Nodetrace-Windows-x64-v${{ needs.validate.outputs.version }}.exe
            artifact_name: nodetrace-windows-installer
            artifact_glob: release/*.exe
          - os: macos-latest
            label: macOS
            build_command: npx electron-builder --mac dmg --publish never
            final_name: Nodetrace-macOS-arm64-v${{ needs.validate.outputs.version }}.dmg
            artifact_name: nodetrace-macos-installer
            artifact_glob: release/*.dmg

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout bundled server
        uses: actions/checkout@v6
        with:
          repository: erikrubstein/Nodetrace-Server
          ref: ${{ needs.validate.outputs.server_ref }}
          path: .server-runtime-source

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check macOS signing secrets
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_BASE64 || secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD || secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 || secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID || secrets.APPLE_API_ISSUER || '' }}
        run: |
          missing=()
          [[ -n "$CSC_LINK" ]] || missing+=("MACOS_CERTIFICATE_BASE64 or MAC_CSC_LINK")
          [[ -n "$CSC_KEY_PASSWORD" ]] || missing+=("MACOS_CERTIFICATE_PASSWORD or MAC_CSC_KEY_PASSWORD")
          [[ -n "$APPLE_API_KEY_BASE64" ]] || missing+=("APPLE_API_KEY_BASE64 or APPLE_API_KEY")
          [[ -n "$APPLE_API_KEY_ID" ]] || missing+=("APPLE_API_KEY_ID")
          [[ -n "$APPLE_API_ISSUER_ID" ]] || missing+=("APPLE_API_ISSUER_ID or APPLE_API_ISSUER")
          if [[ "${#missing[@]}" -gt 0 ]]; then
            printf 'Missing macOS signing/notarization secrets:\n' >&2
            printf ' - %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Import Developer ID certificate
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_BASE64 || secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD || secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          certificate_path="${RUNNER_TEMP}/developer-id-application.p12"
          keychain_path="${RUNNER_TEMP}/app-signing.keychain-db"
          keychain_password="$(uuidgen)"

          printf '%s' "$CSC_LINK" | base64 -D > "$certificate_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$CSC_KEY_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

      - name: Build installer
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && (secrets.MACOS_CERTIFICATE_BASE64 || secrets.MAC_CSC_LINK) || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && (secrets.MACOS_CERTIFICATE_PASSWORD || secrets.MAC_CSC_KEY_PASSWORD) || '' }}
          CSC_NAME: ${{ runner.os == 'macOS' && secrets.CODE_SIGN_IDENTITY || '' }}
          NODETRACE_SERVER_SOURCE_DIR: ${{ github.workspace }}/.server-runtime-source
        run: npm run prepare:local-server && npm run build:web && ${{ matrix.build_command }}

      - name: Normalize artifact filename
        run: |
          shopt -s nullglob
          files=( ${{ matrix.artifact_glob }} )
          if [[ "${#files[@]}" -ne 1 ]]; then
            echo "Expected exactly one installer artifact, found ${#files[@]}" >&2
            printf '%s\n' "${files[@]}"
            exit 1
          fi
          mv "${files[0]}" "release/${{ matrix.final_name }}"

      - name: Notarize and staple DMG
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 || secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID || secrets.APPLE_API_ISSUER }}
          CODE_SIGN_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY || '' }}
        run: |
          api_key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$api_key_path"

          dmg_path="release/${{ matrix.final_name }}"
          if [[ ! -f "$dmg_path" ]]; then
            echo "No DMG found at $dmg_path." >&2
            exit 1
          fi

          signing_identity="$CODE_SIGN_IDENTITY"
          if [[ -z "$signing_identity" ]]; then
            signing_identity="$(security find-identity -v -p codesigning | awk -F '"' '/Developer ID Application/ { print $2; exit }')"
          fi
          if [[ -z "$signing_identity" ]]; then
            echo "No Developer ID Application signing identity is available for DMG signing." >&2
            exit 1
          fi

          codesign --force --sign "$signing_identity" --timestamp "$dmg_path"
          codesign --verify --verbose=2 "$dmg_path"

          xcrun notarytool submit "$dmg_path" \
            --key "$api_key_path" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$dmg_path"
          xcrun stapler validate "$dmg_path"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: release/${{ matrix.final_name }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - validate
      - build-web
      - build-installers
    if: needs.validate.outputs.is_release == 'true'
    steps:
      - name: Download web bundle
        uses: actions/download-artifact@v5
        with:
          name: nodetrace-web-bundle
          path: release-assets

      - name: Download Windows installer
        uses: actions/download-artifact@v5
        with:
          name: nodetrace-windows-installer
          path: release-assets

      - name: Download macOS installer
        uses: actions/download-artifact@v5
        with:
          name: nodetrace-macos-installer
          path: release-assets

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            prerelease_args=()
            if [[ "${{ needs.validate.outputs.is_prerelease }}" == "true" ]]; then
              prerelease_args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" \
              --repo "$RELEASE_REPO" \
              --title "Nodetrace $RELEASE_TAG" \
              --generate-notes \
              "${prerelease_args[@]}"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$RELEASE_REPO" --clobber
