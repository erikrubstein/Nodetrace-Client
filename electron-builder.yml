appId: com.nodetrace.desktop
productName: Nodetrace
directories:
  buildResources: build
  output: release
files:
  - dist/**
  - apps/desktop/**
  - apps/renderer/public/**
  - packages/shared/**
  - build/**
  - package.json
extraMetadata:
  main: apps/desktop/launcher.cjs
mac:
  category: public.app-category.graphics-design
  icon: build/mac/app-icon.icns
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extendInfo:
    NSCameraUsageDescription: Nodetrace uses the camera to capture photos for project nodes.
  target:
    - dmg
dmg:
  icon: build/mac/dmg-icon.icns
win:
  icon: build/icon.ico
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
